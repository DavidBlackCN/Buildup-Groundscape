name: Build

on:
  push:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - ".gitattributes"
  pull_request:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - ".gitattributes"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and verify resources
        run: |
          ./gradlew runDatagen
          git diff --exit-code -- src/main/generated
          python3 scripts/verify_resources.py

      - name: Build and run dedicated game tests
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buildup-Groundscape-Artifacts
          path: build/libs/
